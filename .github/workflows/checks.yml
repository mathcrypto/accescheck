name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - run: npm test
      - run: npm run build
      - run: npm run validate
  deploy-production:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_rzuudNu04kyY0gpX920s2JKa
      VERCEL_PROJECT_ID: prj_7kwbByf2dDyZrhV1tCLmtMqAuuLZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Install Vercel CLI
        run: npm install --global vercel@65.2.0
      - name: Build production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Ajoutez le secret Actions VERCEL_TOKEN dans les paramètres du dépôt."
            exit 1
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production
        id: production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_SEARCH_MODEL: ${{ vars.OPENAI_SEARCH_MODEL }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
        run: |
          runtime_env=()
          search_configured=false
          if [ -n "$OPENAI_API_KEY" ]; then
            runtime_env+=(--env "OPENAI_API_KEY=$OPENAI_API_KEY")
            search_configured=true
          fi
          for model_name in OPENAI_MODEL OPENAI_SEARCH_MODEL OPENAI_REVIEW_MODEL; do
            if [ -n "${!model_name}" ]; then
              runtime_env+=(--env "$model_name=${!model_name}")
            fi
          done
          vercel deploy --prebuilt --prod "${runtime_env[@]}" --token="$VERCEL_TOKEN"
          echo "search_configured=$search_configured" >> "$GITHUB_OUTPUT"
      - name: Verify public application
        env:
          REQUIRE_SEARCH_AGENT: ${{ steps.production.outputs.search_configured }}
        run: node scripts/check-public-deployment.mjs https://accescheck.vercel.app
