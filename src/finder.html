<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>AccèsCheck — Trouver un cabinet</title>
    <meta
      name="description"
      content="Décrivez vos besoins. Un compagnon propose des critères documentés, puis cherche dans Accès Libre."
    />
    <style>
      /*PAGE_STYLE*/
    </style>
  </head>
  <body>
    <a class="skip" href="#message">Aller à la conversation</a>
    <!--SITE_HEADER-->
    <main>
      <section class="hero">
        <h1>Trouver un cabinet</h1>
        <p>
          Décrivez vos besoins d’accès. Le compagnon propose des critères documentés, puis cherche
          dans Accès Libre.
        </p>
      </section>

      <section class="chat-panel" aria-label="Conversation">
        <div class="thread" id="thread" aria-live="polite"></div>

        <div class="examples" role="group" aria-label="Exemples de besoin">
          <button type="button" class="example" data-need="vision">Canne blanche</button>
          <button type="button" class="example" data-need="audition">Besoin auditif</button>
          <button type="button" class="example" data-need="fauteuil">Fauteuil</button>
          <button type="button" class="example" data-need="lsf">LSF</button>
          <button type="button" class="example" data-need="besoin-lieu">Besoin + lieu</button>
        </div>

        <form class="composer" id="form">
          <label class="sr-only" for="message">Votre message</label>
          <textarea
            id="message"
            maxlength="2000"
            rows="3"
            placeholder="Exemple : je me déplace avec une canne blanche… Corrigez ici pour rectifier."
          ></textarea>
          <div class="row">
            <button class="primary" id="send" type="submit">Envoyer</button>
            <button class="ghost" id="clear" type="button">Nouvelle conversation</button>
          </div>
          <p class="hint-line">
            Une seule demande à la fois : envoyer une correction remplace la précédente.
          </p>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="results-panel" aria-label="Résultats">
        <div class="results" id="results" aria-live="polite">
          <p class="empty">Les cabinets correspondants apparaîtront ici après la recherche.</p>
        </div>
      </section>
    </main>
    <script>
      /*PAGE_SCRIPT*/
    </script>
  </body>
</html>
