<header class="site-header">
  <a class="brand" href="/?lang={{common.language}}" aria-label="{{common.nav.brand}}"
    ><span class="brand-mark" aria-hidden="true"
      ><svg viewBox="0 0 64 64" fill="none">
        <path
          d="M32 8v48M11.2 20l41.6 24M11.2 44l41.6-24"
          stroke="#bd292e"
          stroke-width="9"
        /></svg></span
    ><span>AccèsCheck</span></a
  >
  <details class="menu">
    <summary>{{common.menu}}</summary>
    <nav aria-label="{{common.nav.label}}">
      <a href="/?lang={{common.language}}">{{common.nav.home}}</a
      ><a href="/?lang={{common.language}}#recherche">{{common.nav.describe}}</a
      ><a href="/consultation?lang={{common.language}}">{{common.nav.consultation}}</a>
      <a href="/profil?lang={{common.language}}">{{common.nav.profile}}</a>
      <a
        id="langSwitch"
        href="?lang={{common.languageSwitch.target}}"
        lang="{{common.languageSwitch.target}}"
        hreflang="{{common.languageSwitch.target}}"
        >{{common.languageSwitch.label}}</a
      >
      <!--HOME_CONTROLS-->
    </nav>
  </details>
